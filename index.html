<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>タク計 マスター Ver2.6</title>

<style>
:root{
  --ios-blue:#007AFF;
  --ios-red:#ff3b30;
  --soft-blue:#e7f2ff;
  --soft-red:#fff1f0;
}

body{
  font-family:-apple-system,sans-serif;
  background:#f0f4f8;
  margin:0;
  padding:12px;
  padding-bottom:110px;
  color:#333;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:15px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  margin-bottom:15px;
}

h1{
  font-size:1rem;
  color:var(--ios-blue);
  margin-bottom:10px;
}

input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:2px solid #eee;
  margin-bottom:10px;
}

input[type="number"]{
  font-size:2.5rem;
  font-weight:bold;
  text-align:center;
  color:var(--ios-blue);
}

.sales-label{
  text-align:center;
  font-size:1.3rem;
  font-weight:900;
  display:block;
}

.result{
  background:#fdfdfd;
  padding:15px;
  border-radius:12px;
  text-align:center;
  border:2px solid #eef6ff;
}

.income{
  font-size:2.4rem;
  font-weight:bold;
  color:var(--ios-red);
}

.btn-save{
  width:100%;
  padding:16px;
  background:var(--ios-blue);
  color:#fff;
  border:none;
  border-radius:14px;
  font-size:1.2rem;
  font-weight:bold;
}

.tab-content{display:none;}
.tab-content.active{display:block;}

table{width:100%;border-collapse:collapse;}
td,th{padding:10px;border-bottom:1px solid #eee;}
.td-date{text-align:left;}

.btn-group{display:flex;gap:6px;}
.action-btn{
  width:44px;height:44px;
  border-radius:12px;
  border:none;
  font-size:1.2rem;
}
.delete-btn{background:var(--soft-red);color:var(--ios-red);}

/* 押しやすい下タブ */
nav{
  position:fixed;
  bottom:0;left:0;
  width:100%;
  height:80px;
  background:#fff;
  display:flex;
  border-top:1px solid #ddd;
}

nav button{
  flex:1;
  border:none;
  background:none;
  font-size:1rem;
}

nav button.active{
  color:var(--ios-blue);
  font-weight:bold;
  background:#f0f7ff;
  border-top:3px solid var(--ios-blue);
}
</style>
</head>

<body>

<div id="inputPage" class="tab-content active">
  <div class="card">
    <h1>💰 売上入力</h1>
    <input type="date" id="workDate">
    <span class="sales-label">税抜売上入力</span>
    <input type="number" id="sales" placeholder="0" oninput="calc()">

    <div id="resArea" class="result" style="display:none;">
      <div>歩合 <span id="rate">55</span>%</div>
      <div class="income"><span id="income">0</span>円</div>
      <button class="btn-save" onclick="saveData()">保存</button>
    </div>
  </div>
</div>

<div id="historyPage" class="tab-content">
  <div class="card">
    <h1>📊 履歴</h1>
    <table>
      <tbody id="historyList"></tbody>
    </table>
  </div>
</div>

<nav>
  <button id="tabInput" class="active" onclick="showPage('input')">✏️ 入力</button>
  <button id="tabHistory" onclick="showPage('history')">📊 履歴</button>
</nav>

<script>
const workDate = document.getElementById("workDate");
const sales = document.getElementById("sales");
const resArea = document.getElementById("resArea");
const income = document.getElementById("income");
const historyList = document.getElementById("historyList");

workDate.valueAsDate = new Date();

function calc(){
  const s = Number(sales.value);
  if(!s){ resArea.style.display="none"; return; }
  resArea.style.display="block";
  income.textContent = Math.floor(s*0.55).toLocaleString();
}

function saveData(){
  const s = Number(sales.value);
  const d = workDate.value;
  if(!s || !d) return alert("入力してね");
  const h = JSON.parse(localStorage.getItem("taxi_history")||"[]");
  h.push({id:Date.now(),date:d,sales:s});
  localStorage.setItem("taxi_history",JSON.stringify(h));
  sales.value="";
  resArea.style.display="none";
}

function updateHistory(){
  const h = JSON.parse(localStorage.getItem("taxi_history")||"[]");
  historyList.innerHTML = h.map(d=>`
    <tr>
      <td class="td-date">${d.date}</td>
      <td>${d.sales.toLocaleString()}</td>
      <td>
        <button class="action-btn delete-btn" onclick="del(${d.id})">🗑️</button>
      </td>
    </tr>`).join("");
}

function del(id){
  const h = JSON.parse(localStorage.getItem("taxi_history")||"[]")
    .filter(x=>x.id!==id);
  localStorage.setItem("taxi_history",JSON.stringify(h));
  updateHistory();
}

function showPage(p){
  document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  if(p==="input"){
    document.getElementById("inputPage").classList.add("active");
    document.getElementById("tabInput").classList.add("active");
  }else{
    document.getElementById("historyPage").classList.add("active");
    document.getElementById("tabHistory").classList.add("active");
    updateHistory();
  }
}
</script>

</body>
</html>
