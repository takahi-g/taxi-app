<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>タク計 マスター Ver2.7</title>

<style>
:root {
--ios-blue:#007AFF; --ios-red:#ff3b30; --sub-green:#28a745;
--soft-blue:#e7f2ff; --soft-red:#fff1f0;
}
body{font-family:-apple-system,sans-serif;background:#f0f4f8;margin:0;padding:12px;padding-bottom:90px;}
.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:15px;}
h1{font-size:1rem;color:var(--ios-blue);margin:0 0 10px;}
select,input{width:100%;padding:12px;font-size:1.1rem;border:2px solid #eee;border-radius:12px;margin-bottom:10px;}
.total-box{background:#333;color:#fff;padding:18px;border-radius:16px;margin-bottom:15px;}
table{width:100%;border-collapse:collapse;}
th{font-size:.8rem;color:#666;border-bottom:2px solid #eee;padding-bottom:6px;}
td{padding:10px;border-bottom:1px solid #eee;text-align:right;}
.td-date{text-align:left;}
.btn-group{display:flex;gap:8px;justify-content:flex-end;}
.action-btn{width:46px;height:46px;border-radius:12px;border:none;font-size:1.3rem;}
.edit-btn{background:var(--soft-blue);color:var(--ios-blue);}
.delete-btn{background:var(--soft-red);color:var(--ios-red);}
nav{position:fixed;bottom:0;left:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;}
nav button{flex:1;border:none;background:none;height:60px;font-size:1rem;}
nav .active-tab{color:var(--ios-blue);font-weight:bold;}
.tab-content{display:none;}
.active{display:block;}
</style>
</head>

<body>

<div id="input-page" class="tab-content active">
  <div class="card">
    <h1>💰 売上入力</h1>
    <input type="date" id="work-date">
    <input type="number" id="sales" placeholder="税抜売上">
    <button onclick="saveData()">保存</button>
  </div>
</div>

<div id="history-page" class="tab-content">
  <div class="card">
    <h1>📅 表示設定</h1>
    <select id="view-mode" onchange="updateHistory()">
      <option value="current">今月</option>
      <option value="month">月指定</option>
      <option value="year">今年</option>
    </select>
    <select id="view-year" onchange="updateHistory()"></select>
    <select id="view-month" onchange="updateHistory()"></select>
  </div>

  <div class="total-box">
    <div id="total-label">集計</div>
    <div id="total-income">0円</div>
    <div>総売上: <span id="total-sales">0</span>円</div>
  </div>

  <div class="card">
    <table>
      <thead id="list-head"></thead>
      <tbody id="history-list"></tbody>
    </table>
  </div>
</div>

<nav>
  <button class="active-tab" onclick="showPage('input')">入力</button>
  <button onclick="showPage('history')">履歴</button>
</nav>

<script>
const STORAGE='taxi_history';

function getRate(s){if(s>=550000)return 60.8;if(s>=470000)return 57.9;if(s>=420000)return 55;return 55;}
function load(){return JSON.parse(localStorage.getItem(STORAGE)||'[]');}
function save(h){localStorage.setItem(STORAGE,JSON.stringify(h));}

function saveData(){
 const s=+sales.value; if(!s)return;
 const h=load(); h.push({id:Date.now(),date:work-date.value,sales:s});
 save(h); sales.value=''; updateHistory();
}

function updateHistory(){
 const h=load();
 const mode=view-mode.value;
 const y=view-year.value;
 const m=view-month.value;
 let list=[], total=0;

 if(mode==='current'){
  const now=new Date();
  list=h.filter(d=>d.date.startsWith(`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`));
  total-label.innerText='今月';
 }
 if(mode==='month'){
  list=h.filter(d=>d.date.startsWith(`${y}-${m}`));
  total-label.innerText=`${y}年${m}月`;
 }
 if(mode==='year'){
  const map={};
  h.filter(d=>d.date.startsWith(y)).forEach(d=>{
    const mm=d.date.substring(5,7);
    map[mm]=(map[mm]||0)+d.sales;
  });
  list=Object.entries(map).map(([k,v])=>({month:k,sales:v}));
 }

 if(mode!=='year'){
  total=list.reduce((s,d)=>s+d.sales,0);
  list-head.innerHTML='<tr><th>日付</th><th>売上</th></tr>';
  history-list.innerHTML=list.map(d=>`<tr><td class="td-date">${d.date}</td><td>${d.sales.toLocaleString()}</td></tr>`).join('');
 }else{
  list-head.innerHTML='<tr><th>月</th><th>売上</th><th>手取り</th></tr>';
  history-list.innerHTML=list.map(d=>{
    const inc=Math.floor(d.sales*(getRate(d.sales)/100));
    total+=inc;
    return `<tr><td class="td-date">${d.month}月</td><td>${d.sales.toLocaleString()}</td><td>${inc.toLocaleString()}</td></tr>`;
  }).join('');
 }

 total-sales.innerText=total.toLocaleString();
 total-income.innerText=Math.floor(total*(getRate(total)/100)).toLocaleString()+'円';
}

function showPage(p){
 document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
 document.querySelectorAll('nav button').forEach(e=>e.classList.remove('active-tab'));
 if(p==='input'){input-page.classList.add('active');}
 else{history-page.classList.add('active');updateHistory();}
}

(function init(){
 const ysel=view-year, msel=view-month, now=new Date();
 for(let y=now.getFullYear();y>=2024;y--) ysel.add(new Option(y+'年',y));
 for(let m=1;m<=12;m++) msel.add(new Option(m+'月',String(m).padStart(2,'0')));
})();
</script>
</body>
</html>
