<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タクシー売上管理</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 12px;
    }
    h1, h2 {
      text-align: center;
    }
    .card {
      background: #fff;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 8px;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      font-size: 16px;
    }
    button {
      background: #007aff;
      color: #fff;
      border: none;
      border-radius: 8px;
      margin-top: 12px;
    }
    button.danger {
      background: #ff3b30;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      border-bottom: 1px solid #ddd;
      padding: 6px;
      text-align: center;
    }
    .small {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

<h1>🚕 タクシー売上管理</h1>

<div class="card">
  <h2>売上入力</h2>
  <label>営業日</label>
  <input type="date" id="workDate">

  <label>売上金額（円）</label>
  <input type="number" id="amount" placeholder="例：35000">

  <label>メモ（任意）</label>
  <input type="text" id="memo" placeholder="例：雨・忙しい">

  <button onclick="addRecord()">追加</button>
</div>

<div class="card">
  <h2>月別集計</h2>
  <select id="monthSelect" onchange="renderSummary()"></select>
  <p id="summaryText"></p>
</div>

<div class="card">
  <h2>売上履歴</h2>
  <table>
    <thead>
      <tr>
        <th>日付</th>
        <th>売上</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="history"></tbody>
  </table>
</div>

<script>
const STORAGE_KEY = "taxi_sales_v1";

let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
}

function addRecord() {
  const date = document.getElementById("workDate").value;
  const amount = Number(document.getElementById("amount").value);
  const memo = document.getElementById("memo").value;

  if (!date || !amount) {
    alert("日付と売上を入力してね");
    return;
  }

  records.push({
    id: Date.now(),
    date,
    amount,
    memo
  });

  save();
  renderAll();
  document.getElementById("amount").value = "";
  document.getElementById("memo").value = "";
}

function deleteRecord(id) {
  if (!confirm("削除する？")) return;
  records = records.filter(r => r.id !== id);
  save();
  renderAll();
}

function renderHistory() {
  const tbody = document.getElementById("history");
  tbody.innerHTML = "";

  records
    .sort((a,b) => a.date < b.date ? 1 : -1)
    .forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.date}</td>
        <td>${r.amount.toLocaleString()}</td>
        <td><button class="danger" onclick="deleteRecord(${r.id})">削除</button></td>
      `;
      tbody.appendChild(tr);
    });
}

function renderMonthSelect() {
  const select = document.getElementById("monthSelect");
  const months = [...new Set(records.map(r => r.date.slice(0,7)))].sort().reverse();

  select.innerHTML = months.map(m => `<option value="${m}">${m}</option>`).join("");
}

function renderSummary() {
  const month = document.getElementById("monthSelect").value;
  if (!month) return;

  const list = records.filter(r => r.date.startsWith(month));
  const total = list.reduce((sum,r) => sum + r.amount, 0);
  const avg = list.length ? Math.round(total / list.length) : 0;

  document.getElementById("summaryText").innerHTML = `
    <strong>合計：</strong>${total.toLocaleString()} 円<br>
    <strong>日数：</strong>${list.length} 日<br>
    <strong>平均：</strong>${avg.toLocaleString()} 円
  `;
}

function renderAll() {
  renderHistory();
  renderMonthSelect();
  renderSummary();
}

renderAll();
</script>

</body>
</html>
