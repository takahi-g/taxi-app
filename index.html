<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>タク計</title>

<style>
:root{
  --blue1:#0a6cff;
  --blue2:#4f6df5;
  --bg:#f2f2f7;
  --red:#ff3b30;
}
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding-bottom:90px;
}

/* ===== 上部カード ===== */
.top-card{
  margin:15px;
  padding:24px;
  border-radius:24px;
  background:linear-gradient(135deg,var(--blue1),var(--blue2));
  color:#fff;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}
.top-card .label{
  opacity:.9;
  font-size:.9rem;
}
.top-card .big{
  font-size:3rem;
  font-weight:900;
  margin:10px 0;
}
.top-card .sub{
  opacity:.85;
  font-size:.9rem;
}

/* ===== 白カード ===== */
.card{
  background:#fff;
  margin:15px;
  padding:20px;
  border-radius:22px;
  box-shadow:0 6px 16px rgba(0,0,0,.08);
}

/* 日付 */
.date-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}
.date-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  border:none;
  background:#e5e5ea;
  font-size:1.4rem;
}
.date-text{
  font-weight:bold;
  font-size:1.1rem;
}

/* 今日合計 */
.today-total{
  background:#111;
  color:#fff;
  padding:12px;
  border-radius:14px;
  text-align:center;
  font-weight:bold;
  margin-bottom:20px;
}

/* 入力 */
.input-area{
  text-align:center;
}
.input-area .label{
  color:#888;
  margin-bottom:8px;
}
.input-area input{
  width:100%;
  border:none;
  font-size:3.5rem;
  text-align:center;
  font-weight:900;
  outline:none;
}
.bar{
  height:4px;
  background:#007aff;
  border-radius:4px;
  margin:10px 0 14px;
}
.predict{
  color:var(--red);
  font-weight:bold;
  font-size:1.2rem;
  margin-bottom:20px;
}
.save-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,var(--blue1),var(--blue2));
  color:#fff;
  font-size:1.3rem;
  font-weight:bold;
}

/* ===== ナビ ===== */
nav{
  position:fixed;
  bottom:0; left:0;
  width:100%;
  height:80px;
  background:#fff;
  display:flex;
  border-top:1px solid #ddd;
}
nav button{
  flex:1;
  border:none;
  background:none;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  font-size:.75rem;
  color:#999;
}
nav button.active{
  color:#007aff;
  font-weight:bold;
}
nav span{
  font-size:1.4rem;
}
</style>
</head>

<body>

<!-- 上 -->
<div class="top-card">
  <div class="label">今日の残りノルマ（税抜）</div>
  <div class="big">12,000円</div>
  <div class="sub">今月の出勤：3 / 12 日</div>
</div>

<!-- 入力 -->
<div class="card">
  <div class="date-row">
    <button class="date-btn">◀</button>
    <div class="date-text">2026/01/03</div>
    <button class="date-btn">▶</button>
  </div>

  <div class="today-total">今日の合計：38,000円</div>

  <div class="input-area">
    <div class="label">本日の税抜売上を追加</div>
    <input type="number" placeholder="0">
    <div class="bar"></div>
    <div class="predict">手取り予測：48,400円</div>
    <button class="save-btn">売上を追加</button>
  </div>
</div>

<!-- ナビ -->
<nav>
  <button class="active"><span>💰</span>入力</button>
  <button><span>📅</span>履歴</button>
  <button><span>⚙️</span>設定</button>
</nav>

</body>
</html>
