<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>タク計 プレミアム Ver11.0</title>
    <link rel="apple-touch-icon" href="https://r.jina.ai/i/6f9064c5770146059d044f60f64c6328">
    <style>
        :root { --ios-blue: #007AFF; --ios-red: #ff3b30; --ios-green: #34c759; --bg: #f2f2f7; --card: #ffffff; --dark-card: #333333; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-top: calc(env(safe-area-inset-top) + 10px); padding-bottom: 100px; color: #1c1c1e; }
        
        /* ヒーローエリア (スクショ再現) */
        .target-hero { background: linear-gradient(135deg, #5e5ce6, #af52de); color: white; border-radius: 20px; padding: 25px 20px; text-align: center; margin-bottom: 20px; }
        .target-hero .val { font-size: 2.8rem; font-weight: 800; margin: 10px 0; }
        
        /* 黒い合計カード (スクショ再現) */
        .black-card { background: var(--dark-card); color: white; border-radius: 20px; padding: 20px; text-align: left; margin-bottom: 20px; position: relative; }
        .badge { background: var(--ios-green); color: white; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .total-val { font-size: 2.4rem; font-weight: 800; }
        .sub-txt { font-size: 0.9rem; opacity: 0.7; margin-top: 5px; }

        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { font-size: 1rem; color: var(--ios-blue); margin: 0 0 15px 0; display: flex; align-items: center; gap: 5px; }

        /* 入力UI */
        .date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        input[type="date"] { flex: 1; border: 1px solid #ddd; border-radius: 12px; padding: 12px; font-size: 1.1rem; text-align: center; color: var(--ios-blue); font-weight: bold; background: #fff; -webkit-appearance: none; }
        .btn-step { background: #fff; border: 1px solid #ddd; width: 45px; height: 45px; border-radius: 12px; font-size: 1.2rem; }
        
        .input-group { text-align: center; }
        .input-group input { width: 90%; border: none; border-bottom: 3px solid var(--ios-blue); font-size: 3rem; text-align: center; font-weight: 800; padding: 10px 0; outline: none; background: transparent; }
        .btn-add { width: 100%; background: var(--ios-blue); color: white; border: none; border-radius: 16px; padding: 20px; font-size: 1.4rem; font-weight: bold; margin-top: 20px; }

        /* 履歴テーブル (スクショ風) */
        .hist-table { width: 100%; border-collapse: collapse; }
        .hist-table th { text-align: left; color: #8e8e93; font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid #f2f2f7; }
        .hist-table td { padding: 15px 0; border-bottom: 1px solid #f2f2f7; vertical-align: middle; }
        .hist-date { font-weight: 500; }
        .hist-sales { font-size: 1.1rem; font-weight: 800; text-align: center; }
        .hist-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-circle { width: 40px; height: 40px; border-radius: 10px; border: none; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; background: #f0f7ff; }
        .btn-del { background: #fff1f0; }

        /* ナビゲーション */
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 0.5px solid #c6c6c8; display: flex; padding-bottom: env(safe-area-inset-bottom); height: 80px; z-index: 1000; }
        nav button { flex: 1; border: none; background: none; color: #8e8e93; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        nav button.active { color: var(--ios-blue); }
        nav button i { font-size: 1.4rem; font-style: normal; }
        nav button span { font-size: 0.75rem; }

        .tab-content { display: none; }
        .active-tab { display: block; }

        #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 25px; border-radius: 30px; font-size: 0.9rem; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; }
        .show-toast { visibility: visible !important; opacity: 1 !important; }
    </style>
</head>
<body>

<div id="toast">保存したよ！🚕</div>

<div id="page-input" class="tab-content active-tab">
    <div class="target-hero">
        <div style="font-size: 0.9rem; opacity: 0.8;">今日の残りノルマ (税抜)</div>
        <div class="val" id="disp-norm">0</div>
        <div id="disp-progress" style="font-size: 0.8rem; opacity: 0.8;">---</div>
    </div>

    <div class="card">
        <div class="date-row">
            <button class="btn-step" onclick="stepDate(-1)">◀</button>
            <input type="date" id="work-date" onchange="refresh()">
            <button class="btn-step" onclick="stepDate(1)">▶</button>
        </div>
        <div class="input-group">
            <div style="background: #1c1c1e; color: white; padding: 6px 15px; border-radius: 10px; font-size: 0.85rem; display: inline-block; margin-bottom: 15px;">
                今日の合計: <span id="disp-today-sum">0</span>円 (税抜)
            </div>
            <label style="display:block; font-size:0.9rem; color:#8e8e93; margin-bottom:10px;">今回の税込運賃を入力</label>
            <input type="number" id="input-gross" pattern="\d*" placeholder="0" oninput="updatePreview()">
            <div id="preview-area" style="margin-top:15px; font-weight:bold; color:var(--ios-red);">手取り予測: 0円</div>
            <button class="btn-add" onclick="saveData()">売上を追加する</button>
        </div>
    </div>
</div>

<div id="page-history" class="tab-content">
    <div class="card" style="padding: 10px; background: transparent; box-shadow: none;">
        <div style="display: flex; gap: 10px;">
            <select id="hist-year" onchange="refresh()" style="flex:1; padding:12px; border-radius:12px; border:none; font-weight:bold;"></select>
            <select id="hist-month" onchange="refresh()" style="flex:1; padding:12px; border-radius:12px; border:none; font-weight:bold;"></select>
        </div>
    </div>

    <div class="black-card">
        <div id="hist-label" style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 5px;">----年--月の合計</div>
        <div class="badge" id="hist-rate">暫定歩合: --%</div>
        <div class="total-val" id="hist-total-income">0円</div>
        <div class="sub-txt">期間総売上(税抜): <span id="hist-total-sales">0</span>円</div>
    </div>

    <div class="card">
        <h2 style="color:#1c1c1e">履歴</h2>
        <table class="hist-table">
            <thead><tr><th>日付</th><th style="text-align:center;">売上</th><th style="text-align:right;">操作</th></tr></thead>
            <tbody id="history-list"></tbody>
        </table>
    </div>
</div>

<div id="page-settings" class="tab-content">
    <div class="card">
        <h2>⚙️ 目標・出勤設定</h2>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #f2f2f7;">
            <span>目標売上 (税抜)</span>
            <input type="number" id="set-goal" oninput="saveSettings()" style="width:120px; text-align:right; border:none; font-size:1.1rem; font-weight:bold; color:var(--ios-blue);">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0;">
            <span>全出勤日数</span>
            <input type="number" id="set-days" oninput="saveSettings()" style="width:120px; text-align:right; border:none; font-size:1.1rem; font-weight:bold; color:var(--ios-blue);">
        </div>
    </div>
    <div class="card" style="background: #eef6ff;">
        <h2>📊 ステータス</h2>
        <div id="stat-area" style="font-size:0.95rem; line-height:2;">
            残り日数: <span id="stat-remain" style="font-weight:bold; color:var(--ios-blue);">0</span>日<br>
            1日あたりの平均ノルマ (税抜): <span id="stat-daily-norm" style="font-weight:bold; color:var(--ios-red);">0</span>円
        </div>
    </div>
</div>

<nav>
    <button onclick="showPage('input')" id="nav-input" class="active"><i>💰</i><span>入力</span></button>
    <button onclick="showPage('history')" id="nav-history"><i>📅</i><span>履歴・集計</span></button>
    <button onclick="showPage('settings')" id="nav-settings"><i>⚙️</i><span>設定</span></button>
</nav>

<script>
    const DB = {
        save: (key, data) => localStorage.setItem(key, JSON.stringify(data)),
        load: (key, def) => JSON.parse(localStorage.getItem(key)) || def
    };

    function getRate(netSales) {
        if (netSales >= 550000) return 60.8;
        if (netSales >= 470000) return 57.9;
        return 55.0;
    }

    function refresh() {
        const history = DB.load('taxi_v11_hist', []);
        const sets = DB.load('taxi_v11_sets', { goal: 550000, days: 12 });
        const selectedDate = document.getElementById('work-date').value;
        const curMonth = selectedDate.substring(0, 7);

        // 入力画面の計算
        const monthlyData = history.filter(h => h.date.startsWith(curMonth));
        const totalNetSales = monthlyData.reduce((sum, h) => sum + h.net, 0);
        const workedCount = [...new Set(monthlyData.map(h => h.date))].length;
        const isTodayWorked = history.some(h => h.date === selectedDate);
        const remainDays = Math.max(1, sets.days - (isTodayWorked ? workedCount - 1 : workedCount));
        
        const salesExcludeToday = monthlyData.filter(h => h.date !== selectedDate).reduce((sum, h) => sum + h.net, 0);
        const dailyNorm = Math.ceil(Math.max(0, sets.goal - salesExcludeToday) / remainDays);
        const todayNetSum = monthlyData.filter(h => h.date === selectedDate).reduce((sum, h) => sum + h.net, 0);

        document.getElementById('disp-norm').innerText = Math.max(0, dailyNorm - todayNetSum).toLocaleString() + " 円";
        document.getElementById('disp-progress').innerText = `進捗: ${workedCount} / ${sets.days} 回目`;
        document.getElementById('disp-today-sum').innerText = Math.floor(todayNetSum).toLocaleString();

        // 履歴画面のフィルタと表示
        const fYear = document.getElementById('hist-year').value;
        const fMonth = document.getElementById('hist-month').value;
        const filterStr = `${fYear}-${fMonth}`;
        const filteredHist = history.filter(h => h.date.startsWith(filterStr));
        const fTotalNet = filteredHist.reduce((sum, h) => sum + h.net, 0);
        const fRate = getRate(fTotalNet);

        document.getElementById('hist-label').innerText = `${fYear}年${fMonth}月の合計`;
        document.getElementById('hist-rate').innerText = `暫定歩合: ${fRate}%`;
        document.getElementById('hist-total-income').innerText = Math.floor(fTotalNet * (fRate/100)).toLocaleString() + "円";
        document.getElementById('hist-total-sales').innerText = Math.floor(fTotalNet).toLocaleString();

        const listHtml = filteredHist.sort((a,b) => b.id - a.id).map(h => `
            <tr>
                <td class="hist-date">${h.date.substring(5).replace('-','/')}</td>
                <td class="hist-sales">${Math.floor(h.net).toLocaleString()}</td>
                <td class="hist-btns">
                    <button class="btn-circle" onclick="editData(${h.id})">✏️</button>
                    <button class="btn-circle btn-del" onclick="deleteData(${h.id})">🗑️</button>
                </td>
            </tr>
        `).join('');
        document.getElementById('history-list').innerHTML = listHtml || '<tr><td colspan="3" style="text-align:center;padding:20px;">データなし</td></tr>';

        // 設定画面
        document.getElementById('stat-remain').innerText = remainDays;
        document.getElementById('stat-daily-norm').innerText = dailyNorm.toLocaleString();
        
        updatePreview();
    }

    function updatePreview() {
        const gross = parseFloat(document.getElementById('input-gross').value) || 0;
        const net = Math.floor(gross / 1.1);
        const history = DB.load('taxi_v11_hist', []);
        const month = document.getElementById('work-date').value.substring(0, 7);
        const total = history.filter(h => h.date.startsWith(month)).reduce((sum, h) => sum + h.net, 0);
        const rate = getRate(total + net);
        document.getElementById('preview-area').innerText = `手取り予測: ${Math.floor((total + net) * (rate/100)).toLocaleString()}円`;
    }

    function saveData() {
        const date = document.getElementById('work-date').value;
        const gross = parseFloat(document.getElementById('input-gross').value);
        if (!gross) return;
        const history = DB.load('taxi_v11_hist', []);
        history.push({ id: Date.now(), date, gross, net: Math.floor(gross/1.1) });
        DB.save('taxi_v11_hist', history);
        document.getElementById('input-gross').value = '';
        showToast("保存完了！🚕");
        refresh();
    }

    function deleteData(id) {
        if (!confirm('削除しますか？')) return;
        let history = DB.load('taxi_v11_hist', []);
        DB.save('taxi_v11_hist', history.filter(h => h.id !== id));
        refresh();
    }

    function editData(id) {
        let history = DB.load('taxi_v11_hist', []);
        const item = history.find(h => h.id === id);
        const newVal = prompt('税込売上を修正', item.gross);
        if (newVal !== null) {
            item.gross = parseFloat(newVal);
            item.net = Math.floor(item.gross / 1.1);
            DB.save('taxi_v11_hist', history);
            refresh();
        }
    }

    function saveSettings() {
        DB.save('taxi_v11_sets', {
            goal: parseFloat(document.getElementById('set-goal').value) || 550000,
            days: parseFloat(document.getElementById('set-days').value) || 12
        });
        refresh();
    }

    function stepDate(n) {
        const d = new Date(document.getElementById('work-date').value);
        d.setDate(d.getDate() + n);
        document.getElementById('work-date').valueAsDate = d;
        refresh();
    }

    function showPage(p) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + p).classList.add('active-tab');
        document.getElementById('nav-' + p).classList.add('active');
        refresh();
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.classList.add('show-toast');
        setTimeout(() => t.classList.remove('show-toast'), 2000);
    }

    const today = new Date();
    document.getElementById('work-date').valueAsDate = today;
    const yr = document.getElementById('hist-year');
    for(let y=today.getFullYear(); y>=2024; y--) {
        let o = document.createElement('option'); o.value=y; o.text=y+'年'; yr.add(o);
    }
    const mt = document.getElementById('hist-month');
    for(let m=1; m<=12; m++) {
        let o = document.createElement('option'); o.value=String(m).padStart(2,'0'); o.text=m+'月'; 
        if(m === today.getMonth()+1) o.selected = true;
        mt.add(o);
    }
    const s = DB.load('taxi_v11_sets', { goal: 550000, days: 12 });
    document.getElementById('set-goal').value = s.goal;
    document.getElementById('set-days').value = s.days;
    refresh();
</script>
</body>
</html>
