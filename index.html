<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西鉄タクシー給与計算</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h2 { color: #0054a6; text-align: center; font-size: 1.2rem; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .result { margin-top: 20px; padding: 15px; background: #eef9f1; border-radius: 10px; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
        .highlight { font-weight: bold; color: #d32f2f; font-size: 1.1rem; }
        .info { font-size: 0.8rem; color: #666; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚖 西鉄タクシー給与シミュ</h2>
    
    <div class="input-group">
        <label>月の売上 (税抜 / 円)</label>
        <input type="number" id="sales" placeholder="例: 500000" oninput="calculate()">
    </div>

    <div class="result" id="result-area">
        <div class="result-item">
            <span>歩合率:</span>
            <span id="rate">- %</span>
        </div>
        <div class="result-item">
            <span>概算給与 (税抜):</span>
            <span id="salary" class="highlight">¥0</span>
        </div>
    </div>

    <div class="info">
        ※42万〜47万: 55% / 〜55万: 57.9% / 55万〜: 60.8%<br>
        ここなちゃんや奥様との生活のために稼いじゃおう！
    </div>
</div>

<script>
function calculate() {
    const sales = parseFloat(document.getElementById('sales').value);
    const rateElem = document.getElementById('rate');
    const salaryElem = document.getElementById('salary');
    
    if (!sales || sales <= 0) {
        rateElem.innerText = "- %";
        salaryElem.innerText = "¥0";
        return;
    }

    let rate = 0;
    // 西鉄タクシーの歩合ルールを適用
    if (sales >= 550000) {
        rate = 0.608;
    } else if (sales >= 470000) {
        rate = 0.579;
    } else if (sales >= 420000) {
        rate = 0.55;
    } else {
        rate = 0.50; // 42万未満の想定（最低ラインとして設定）
    }

    const salary = Math.floor(sales * rate);
    
    rateElem.innerText = (rate * 100).toFixed(1) + " %";
    salaryElem.innerText = "¥" + salary.toLocaleString();
}
</script>

</body>
</html>
