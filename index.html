f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///v8f///
    <style>
        :root { --ios-blue: #007AFF; --ios-red: #ff3b30; --ios-green: #34c759; --bg: #f2f2f7; --card: #ffffff; --dark-card: #333333; --pencil-bg: #eef6ff; --trash-bg: #fff1f0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-top: calc(env(safe-area-inset-top) + 10px); padding-bottom: 100px; color: #1c1c1e; }
        
        .target-hero { background: linear-gradient(135deg, #5e5ce6, #af52de); color: white; border-radius: 20px; padding: 25px 20px; text-align: center; margin-bottom: 20px; }
        .target-hero .val { font-size: 2.8rem; font-weight: 800; margin: 10px 0; }
        
        .black-card { background: var(--dark-card); color: white; border-radius: 20px; padding: 20px; text-align: left; margin-bottom: 20px; }
        .badge { background: var(--ios-green); color: white; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .total-val { font-size: 2.4rem; font-weight: 800; }

        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { font-size: 1rem; color: var(--ios-blue); margin: 0 0 15px 0; }

        /* 履歴テーブル (Ver2.6再現) */
        .hist-table { width: 100%; border-collapse: collapse; }
        .hist-table th { text-align: left; color: #8e8e93; font-size: 0.85rem; padding-bottom: 10px; border-bottom: 1px solid #f2f2f7; }
        .hist-table td { padding: 15px 0; border-bottom: 1px solid #f2f2f7; }
        .hist-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-pencil { background: var(--pencil-bg); width: 48px; height: 48px; border-radius: 14px; border: none; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; }
        .btn-trash { background: var(--trash-bg); width: 48px; height: 48px; border-radius: 14px; border: none; font-size: 1.4rem; display: flex; align-items: center; justify-content: center; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 0.5px solid #c6c6c8; display: flex; padding-bottom: env(safe-area-inset-bottom); height: 80px; }
        nav button { flex: 1; border: none; background: none; color: #8e8e93; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        nav button.active { color: var(--ios-blue); }
        .tab-content { display: none; }
        .active-tab { display: block; }
        input[type="date"] { border: 1px solid #ddd; border-radius: 12px; padding: 12px; font-size: 1rem; color: var(--ios-blue); font-weight: bold; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="page-input" class="tab-content active-tab">
    <div class="target-hero">
        <div style="font-size: 0.9rem; opacity: 0.8;">今日の残りノルマ (税抜)</div>
        <div class="val" id="disp-norm">0</div>
        <div id="disp-progress" style="font-size: 0.8rem; opacity: 0.8;">---</div>
    </div>
    <div class="card">
        <input type="date" id="work-date" onchange="refresh()" style="margin-bottom:20px;">
        <div style="text-align: center;">
            <div style="background: #1c1c1e; color: white; padding: 6px 15px; border-radius: 10px; font-size: 0.85rem; display: inline-block; margin-bottom: 15px;">
                今日の合計: <span id="disp-today-sum">0</span>円 (税抜)
            </div>
            <input type="number" id="input-gross" pattern="\d*" placeholder="0" style="width:90%; border:none; border-bottom:3px solid var(--ios-blue); font-size:3rem; text-align:center; font-weight:800; outline:none;" oninput="updatePreview()">
            <div id="preview-area" style="margin-top:15px; font-weight:bold; color:var(--ios-red);">手取り予測: 0円</div>
            <button onclick="saveData()" style="width:100%; background:var(--ios-blue); color:white; border:none; border-radius:16px; padding:20px; font-size:1.4rem; font-weight:bold; margin-top:20px;">売上を追加</button>
        </div>
    </div>
</div>

<div id="page-history" class="tab-content">
    <div class="card" style="display:flex; gap:10px; background:transparent; box-shadow:none;">
        <select id="hist-year" onchange="refresh()" style="flex:1; padding:12px; border-radius:12px; border:none; font-weight:bold;"></select>
        <select id="hist-month" onchange="refresh()" style="flex:1; padding:12px; border-radius:12px; border:none; font-weight:bold;"></select>
    </div>
    <div class="black-card">
        <div id="hist-label" style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 5px;">集計</div>
        <div class="badge" id="hist-rate">暫定歩合: --%</div>
        <div class="total-val" id="hist-total-income">0円</div>
        <div style="font-size:0.9rem; opacity:0.7; margin-top:5px;">期間総売上: <span id="hist-total-sales">0</span>円</div>
    </div>
    <div class="card">
        <h2 style="color:#1c1c1e">履歴</h2>
        <table class="hist-table">
            <thead><tr><th>日付</th><th>売上</th><th style="text-align:right;">操作</th></tr></thead>
            <tbody id="history-list"></tbody>
        </table>
    </div>
</div>

<div id="page-settings" class="tab-content">
    <div class="card">
        <h2>⚙️ 設定</h2>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #f2f2f7;">
            <span>目標売上 (税抜)</span>
            <input type="number" id="set-goal" oninput="saveSettings()" style="width:120px; text-align:right; border:none; font-size:1.1rem; font-weight:bold; color:var(--ios-blue);">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0;">
            <span>全出勤日数</span>
            <input type="number" id="set-days" oninput="saveSettings()" style="width:120px; text-align:right; border:none; font-size:1.1rem; font-weight:bold; color:var(--ios-blue);">
        </div>
    </div>
    <div class="card" style="background:#eef6ff;">
        <h2>📊 ステータス</h2>
        <div id="stat-area">
            残り日数: <span id="stat-remain" style="font-weight:bold; color:var(--ios-blue);">0</span>日<br>
            平均ノルマ: <span id="stat-daily-norm" style="font-weight:bold; color:var(--ios-red);">0</span>円
        </div>
    </div>
</div>

<nav>
    <button onclick="showPage('input')" id="nav-input" class="active"><i>💰</i><span>入力</span></button>
    <button onclick="showPage('history')" id="nav-history"><i>📅</i><span>履歴・集計</span></button>
    <button onclick="showPage('settings')" id="nav-settings"><i>⚙️</i><span>設定</span></button>
</nav>

<script>
    const DB = { save: (k, d) => localStorage.setItem(k, JSON.stringify(d)), load: (k, def) => JSON.parse(localStorage.getItem(k)) || def };
    function getRate(net) { if (net >= 550000) return 60.8; if (net >= 470000) return 57.9; return 55.0; }

    function refresh() {
        const history = DB.load('taxi_v11_hist', []);
        const sets = DB.load('taxi_v11_sets', { goal: 550000, days: 12 });
        const now = new Date();
        const logicDate = new Date();
        if (now.getHours() < 7) logicDate.setDate(logicDate.getDate() - 1);
        const todayStr = logicDate.toISOString().substring(0, 10);
        const selectedDate = document.getElementById('work-date').value;
        const curMonth = selectedDate.substring(0, 7);
        const monthlyData = history.filter(h => h.date.startsWith(curMonth));
        const workedCount = [...new Set(monthlyData.map(h => h.date))].length;
        const hasWorkToday = history.some(h => h.date === todayStr);
        const remainDays = Math.max(1, sets.days - (hasWorkToday ? workedCount - 1 : workedCount));
        const salesExcludeToday = monthlyData.filter(h => h.date !== selectedDate).reduce((sum, h) => sum + h.net, 0);
        const dailyNorm = Math.ceil(Math.max(0, sets.goal - salesExcludeToday) / remainDays);
        const todayNetSum = monthlyData.filter(h => h.date === selectedDate).reduce((sum, h) => sum + h.net, 0);

        document.getElementById('disp-norm').innerText = Math.max(0, dailyNorm - todayNetSum).toLocaleString() + " 円";
        document.getElementById('disp-progress').innerText = `進捗: ${workedCount} / ${sets.days} 回目`;
        document.getElementById('disp-today-sum').innerText = Math.floor(todayNetSum).toLocaleString();

        const fYear = document.getElementById('hist-year').value;
        const fMonth = document.getElementById('hist-month').value;
        const fHist = history.filter(h => h.date.startsWith(`${fYear}-${fMonth}`));
        const fTotalNet = fHist.reduce((sum, h) => sum + h.net, 0);
        const fRate = getRate(fTotalNet);
        document.getElementById('hist-label').innerText = `${fYear}年${fMonth}月の合計`;
        document.getElementById('hist-rate').innerText = `暫定歩合: ${fRate}%`;
        document.getElementById('hist-total-income').innerText = Math.floor(fTotalNet * (fRate/100)).toLocaleString() + "円";
        document.getElementById('hist-total-sales').innerText = Math.floor(fTotalNet).toLocaleString();

        document.getElementById('history-list').innerHTML = fHist.sort((a,b) => b.id - a.id).map(h => `
            <tr>
                <td style="font-weight:bold;color:#444;">${h.date.substring(5).replace('-','/')}</td>
                <td style="font-weight:800;font-size:1.1rem;text-align:center;">${Math.floor(h.net).toLocaleString()}</td>
                <td class="hist-btns">
                    <button class="btn-pencil" onclick="editData(${h.id})">✏️</button>
                    <button class="btn-trash" onclick="deleteData(${h.id})">🗑️</button>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="3" style="text-align:center;padding:20px;">なし</td></tr>';

        document.getElementById('stat-remain').innerText = remainDays;
        document.getElementById('stat-daily-norm').innerText = dailyNorm.toLocaleString() + "円";
    }

    function updatePreview() {
        const gross = parseFloat(document.getElementById('input-gross').value) || 0;
        const net = Math.floor(gross / 1.1);
        const history = DB.load('taxi_v11_hist', []);
        const total = history.filter(h => h.date.startsWith(document.getElementById('work-date').value.substring(0, 7))).reduce((sum, h) => sum + h.net, 0);
        document.getElementById('preview-area').innerText = `手取り予測: ${Math.floor((total + net) * (getRate(total + net)/100)).toLocaleString()}円`;
    }

    function saveData() {
        const date = document.getElementById('work-date').value;
        const gross = parseFloat(document.getElementById('input-gross').value);
        if (!gross) return;
        const h = DB.load('taxi_v11_hist', []);
        h.push({ id: Date.now(), date, gross, net: Math.floor(gross/1.1) });
        DB.save('taxi_v11_hist', h);
        document.getElementById('input-gross').value = '';
        refresh();
    }

    function deleteData(id) { if(confirm('消去しますか？')) { const h = DB.load('taxi_v11_hist', []); DB.save('taxi_v11_hist', h.filter(x => x.id !== id)); refresh(); } }
    function editData(id) { const h = DB.load('taxi_v11_hist', []); const i = h.find(x => x.id === id); const n = prompt('税込修正', i.gross); if(n) { i.gross = parseFloat(n); i.net = Math.floor(i.gross/1.1); DB.save('taxi_v11_hist', h); refresh(); } }
    function saveSettings() { DB.save('taxi_v11_sets', { goal: parseFloat(document.getElementById('set-goal').value)||550000, days: parseFloat(document.getElementById('set-days').value)||12 }); refresh(); }
    function showPage(p) { document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab')); document.querySelectorAll('nav button').forEach(el => el.classList.remove('active')); document.getElementById('page-' + p).classList.add('active-tab'); document.getElementById('nav-' + p).classList.add('active'); refresh(); }

    document.getElementById('work-date').valueAsDate = new Date();
    const yr = document.getElementById('hist-year');
    const mt = document.getElementById('hist-month');
    for(let y=2026; y>=2024; y--) { let o = document.createElement('option'); o.value=y; o.text=y+'年'; yr.add(o); }
    for(let m=1; m<=12; m++) { let o = document.createElement('option'); o.value=String(m).padStart(2,'0'); o.text=m+'月'; if(m === new Date().getMonth()+1) o.selected = true; mt.add(o); }
    const s = DB.load('taxi_v11_sets', { goal: 550000, days: 12 });
    document.getElementById('set-goal').value = s.goal; document.getElementById('set-days').value = s.days;
    refresh();
</script>
</body>
</html>
