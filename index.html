<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>タク計 プレミアム Ver10.0</title>
    <link rel="apple-touch-icon" href="https://r.jina.ai/i/6f9064c5770146059d044f60f64c6328">
    <style>
        :root { --ios-blue: #007AFF; --ios-red: #ff3b30; --ios-orange: #ff9500; --bg: #f2f2f7; --card: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-top: calc(env(safe-area-inset-top) + 10px); padding-bottom: 100px; color: #1c1c1e; }
        
        /* ノルマ表示 */
        .target-hero { background: linear-gradient(135deg, #007AFF, #5856D6); color: white; border-radius: 20px; padding: 25px 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,122,255,0.2); }
        .target-hero .val { font-size: 2.5rem; font-weight: 800; margin: 10px 0; }
        
        .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { font-size: 0.9rem; color: #8e8e93; margin: 0 0 15px 0; }

        /* 日付操作 */
        .date-ctrl { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .btn-step { background: #e5e5ea; border: none; border-radius: 10px; width: 45px; height: 45px; font-weight: bold; }
        input[type="date"] { flex: 1; border: 2px solid #e5e5ea; border-radius: 10px; height: 42px; text-align: center; font-size: 1rem; font-weight: bold; color: var(--ios-blue); -webkit-appearance: none; }

        /* 入力エリア */
        .input-box { text-align: center; }
        .input-box input { width: 85%; border: none; border-bottom: 3px solid var(--ios-blue); font-size: 2.8rem; text-align: center; font-weight: 800; outline: none; padding: 10px 0; background: transparent; }
        .preview-area { margin: 12px 0; font-weight: bold; font-size: 0.95rem; }
        .btn-add { width: 100%; background: var(--ios-blue); color: white; border: none; border-radius: 15px; padding: 18px; font-size: 1.3rem; font-weight: bold; margin-top: 10px; }

        /* 履歴・フィルタ */
        .filter-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .filter-row select { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #c6c6c8; background: white; font-size: 0.9rem; }
        .hist-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 0.5px solid #d1d1d6; }
        .hist-info strong { font-size: 1.1rem; }
        .hist-info div { font-size: 0.8rem; color: #8e8e93; }
        .btn-icon { background: none; border: none; font-size: 1.2rem; padding: 5px; cursor: pointer; }

        /* ナビゲーション */
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); border-top: 0.5px solid #c6c6c8; display: flex; padding-bottom: env(safe-area-inset-bottom); height: 75px; }
        nav button { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8e8e93; gap: 4px; }
        nav button.active { color: var(--ios-blue); }
        nav button i { font-size: 1.4rem; font-style: normal; }
        nav button span { font-size: 0.7rem; font-weight: bold; }

        .tab-content { display: none; }
        .active-tab { display: block; }

        /* 設定項目 */
        .row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 0.5px solid #d1d1d6; }
        .row input { width: 100px; text-align: right; border: none; font-size: 1.1rem; color: var(--ios-blue); font-weight: bold; outline: none; }
        
        #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 25px; border-radius: 30px; font-size: 0.9rem; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; }
        .show-toast { visibility: visible !important; opacity: 1 !important; }
    </style>
</head>
<body>

<div id="toast">保存したよ！🚕</div>

<div id="page-input" class="tab-content active-tab">
    <div class="target-hero" id="hero-bg">
        <small id="hero-label">今日の残りノルマ (税抜)</small>
        <div class="val" id="disp-norm">0</div>
        <div id="disp-days-info" style="font-size: 0.8rem; opacity: 0.9;">出勤: -- / -- 日</div>
    </div>

    <div class="card">
        <div class="date-ctrl">
            <button class="btn-step" onclick="stepDate(-1)">◀</button>
            <input type="date" id="work-date" onchange="refresh()">
            <button class="btn-step" onclick="stepDate(1)">▶</button>
        </div>

        <div class="input-box">
            <div style="background: #1c1c1e; color: white; padding: 6px; border-radius: 8px; font-size: 0.8rem; display: inline-block; margin-bottom: 15px;">
                今日の合計: <span id="disp-today-sum">0</span>円 (税抜)
            </div>
            <label style="display:block; font-size:0.9rem; font-weight:bold; color:#666;">本日の売上を入力 (税込)</label>
            <input type="number" id="input-sales-gross" pattern="\d*" placeholder="0" oninput="updatePreview()">
            <div class="preview-area">
                <div style="color:#666; font-size:0.8rem;">税抜額: <span id="pre-net">0</span>円</div>
                <div style="color:var(--ios-red); margin-top:4px;">手取り予測: <span id="pre-income">0</span>円</div>
            </div>
            <button class="btn-add" onclick="saveData()">売上を追加する</button>
        </div>
    </div>
</div>

<div id="page-history" class="tab-content">
    <div class="card" style="background: #1c1c1e; color: white; text-align: center;">
        <div style="color: #8e8e93; font-size: 0.8rem;" id="hist-title">集計</div>
        <div style="font-size: 2rem; font-weight: 800; color: var(--ios-orange);" id="hist-total-income">0円</div>
        <div style="font-size: 0.9rem; opacity: 0.8; margin-top: 5px;">売上合計(税抜): <span id="hist-total-sales">0</span>円</div>
    </div>

    <div class="card">
        <h2>📅 履歴フィルタ</h2>
        <div class="filter-row">
            <select id="filter-year" onchange="refresh()"></select>
            <select id="filter-month" onchange="refresh()"></select>
        </div>
        <div id="history-list"></div>
    </div>
</div>

<div id="page-settings" class="tab-content">
    <div class="card">
        <h2>⚙️ 目標設定</h2>
        <div class="row">
            <label>今月の目標 (税抜)</label>
            <input type="number" id="set-goal" oninput="saveSettings()">
        </div>
        <div class="row">
            <label>月間の出勤日数</label>
            <input type="number" id="set-days" oninput="saveSettings()">
        </div>
    </div>
    <div class="card" style="background: #eef6ff;">
        <h2>📊 今月の状況</h2>
        <div class="row"><span>既に出勤した日数</span><span id="stat-worked">0 日</span></div>
        <div class="row"><span>残りの出勤日数</span><span id="stat-remain">0 日</span></div>
        <div class="row" style="border:none; font-weight:bold;">
            <span>1日平均ノルマ</span><span id="stat-norm" style="color:var(--ios-blue);">0円</span>
        </div>
    </div>
</div>

<nav>
    <button onclick="showPage('input')" id="nav-input" class="active"><i>💰</i><span>入力</span></button>
    <button onclick="showPage('history')" id="nav-history"><i>📅</i><span>履歴</span></button>
    <button onclick="showPage('settings')" id="nav-settings"><i>⚙️</i><span>設定</span></button>
</nav>

<script>
    const DB = {
        save: (key, data) => localStorage.setItem(key, JSON.stringify(data)),
        load: (key, def) => JSON.parse(localStorage.getItem(key)) || def
    };

    // 西鉄タクシー歩合計算（税抜売上から算出）
    function getIncome(netSales) {
        let rate = 0.55;
        if (netSales >= 550000) rate = 0.608;
        else if (netSales >= 470000) rate = 0.579;
        return Math.floor(netSales * rate);
    }

    function refresh() {
        const history = DB.load('taxi_v10_hist', []);
        const sets = DB.load('taxi_v10_sets', { goal: 550000, days: 12 });
        const selectedDate = document.getElementById('work-date').value;
        const curMonth = selectedDate.substring(0, 7);

        // 履歴画面用の年月フィルタ
        const fYear = document.getElementById('filter-year').value;
        const fMonth = document.getElementById('filter-month').value;
        const filterStr = `${fYear}-${fMonth}`;

        // 今月のデータ（ノルマ計算用）
        const monthly = history.filter(h => h.date.startsWith(curMonth));
        const totalNetSales = monthly.reduce((sum, h) => sum + h.net, 0);
        const workedDates = [...new Set(monthly.map(h => h.date))];
        const workedCount = workedDates.length;

        // 残り日数の計算（今日がまだ履歴になければカウントを調整）
        const hasWorkToday = history.some(h => h.date === selectedDate);
        const remainDays = Math.max(1, sets.days - (hasWorkToday ? workedCount - 1 : workedCount));

        // 今日のノルマ計算
        const salesExcludeToday = monthly.filter(h => h.date !== selectedDate).reduce((sum, h) => sum + h.net, 0);
        const need = Math.max(0, sets.goal - salesExcludeToday);
        const dailyTarget = Math.ceil(need / remainDays);
        
        const todayNetSum = monthly.filter(h => h.date === selectedDate).reduce((sum, h) => sum + h.net, 0);
        const todayLeft = dailyTarget - todayNetSum;

        // UI: 入力画面
        const normDisp = document.getElementById('disp-norm');
        const heroBg = document.getElementById('hero-bg');
        if (todayLeft <= 0) {
            normDisp.innerText = "目標達成！";
            heroBg.style.background = "var(--ios-orange)";
        } else {
            normDisp.innerText = todayLeft.toLocaleString() + "円";
            heroBg.style.background = "linear-gradient(135deg, #007AFF, #5856D6)";
        }
        document.getElementById('disp-days-info').innerText = `出勤進捗: ${workedCount} / ${sets.days} 日`;
        document.getElementById('disp-today-sum').innerText = Math.floor(todayNetSum).toLocaleString();

        // UI: 履歴画面（フィルタされた月を表示）
        const filteredData = history.filter(h => h.date.startsWith(filterStr));
        const fTotalNet = filteredData.reduce((sum, h) => sum + h.net, 0);
        document.getElementById('hist-title').innerText = `${fMonth}月の予想給料`;
        document.getElementById('hist-total-sales').innerText = Math.floor(fTotalNet).toLocaleString();
        document.getElementById('hist-total-income').innerText = getIncome(fTotalNet).toLocaleString() + "円";

        const listHtml = filteredData.sort((a,b) => b.id - a.id).map(h => `
            <div class="hist-item">
                <div class="hist-info">
                    <strong>${h.date.split('-')[2]}日</strong>
                    <div>税抜: ${Math.floor(h.net).toLocaleString()}円 (税込:${h.gross.toLocaleString()}円)</div>
                </div>
                <div class="hist-actions">
                    <button class="btn-icon" onclick="editData(${h.id})">✏️</button>
                    <button class="btn-icon" onclick="deleteData(${h.id})">🗑️</button>
                </div>
            </div>
        `).join('');
        document.getElementById('history-list').innerHTML = listHtml || '<div style="text-align:center;padding:20px;color:#999;">データなし</div>';

        // UI: 設定画面
        document.getElementById('stat-worked').innerText = workedCount + " 日";
        document.getElementById('stat-remain').innerText = remainDays + " 日";
        document.getElementById('stat-norm').innerText = dailyTarget.toLocaleString() + "円";
        
        updatePreview();
    }

    function updatePreview() {
        const gross = parseFloat(document.getElementById('input-sales-gross').value) || 0;
        const net = Math.floor(gross / 1.1);
        const history = DB.load('taxi_v10_hist', []);
        const month = document.getElementById('work-date').value.substring(0, 7);
        const currentTotal = history.filter(h => h.date.startsWith(month)).reduce((sum, h) => sum + h.net, 0);
        
        document.getElementById('pre-net').innerText = net.toLocaleString();
        document.getElementById('pre-income').innerText = getIncome(currentTotal + net).toLocaleString();
    }

    function saveData() {
        const date = document.getElementById('work-date').value;
        const gross = parseFloat(document.getElementById('input-sales-gross').value);
        if (!gross) return;

        const history = DB.load('taxi_v10_hist', []);
        history.push({ id: Date.now(), date, gross: gross, net: Math.floor(gross / 1.1) });
        DB.save('taxi_v10_hist', history);

        document.getElementById('input-sales-gross').value = '';
        showToast("保存完了！🚕");
        refresh();
    }

    function deleteData(id) {
        if (!confirm('削除していい？')) return;
        let history = DB.load('taxi_v10_hist', []);
        history = history.filter(h => h.id !== id);
        DB.save('taxi_v10_hist', history);
        refresh();
    }

    function editData(id) {
        let history = DB.load('taxi_v10_hist', []);
        const item = history.find(h => h.id === id);
        const newVal = prompt(`${item.date} の売上を修正（税込で入力）`, item.gross);
        if (newVal !== null) {
            const g = parseFloat(newVal) || 0;
            item.gross = g;
            item.net = Math.floor(g / 1.1);
            DB.save('taxi_v10_hist', history);
            refresh();
        }
    }

    function saveSettings() {
        const data = {
            goal: parseFloat(document.getElementById('set-goal').value) || 550000,
            days: parseFloat(document.getElementById('set-days').value) || 12
        };
        DB.save('taxi_v10_sets', data);
        refresh();
    }

    function stepDate(n) {
        const d = new Date(document.getElementById('work-date').value);
        d.setDate(d.getDate() + n);
        document.getElementById('work-date').valueAsDate = d;
        refresh();
    }

    function showPage(p) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + p).classList.add('active-tab');
        document.getElementById('nav-' + p).classList.add('active');
        refresh();
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.classList.add('show-toast');
        setTimeout(() => t.classList.remove('show-toast'), 2000);
    }

    // 初期化処理
    const today = new Date();
    document.getElementById('work-date').valueAsDate = today;

    // フィルタ用の年月生成
    const yr = document.getElementById('filter-year');
    for(let y=today.getFullYear(); y>=2024; y--) {
        let o = document.createElement('option'); o.value=y; o.text=y+'年'; yr.add(o);
    }
    const mt = document.getElementById('filter-month');
    for(let m=1; m<=12; m++) {
        let o = document.createElement('option'); 
        o.value=String(m).padStart(2,'0'); o.text=m+'月'; 
        if(m === today.getMonth()+1) o.selected = true;
        mt.add(o);
    }

    const s = DB.load('taxi_v10_sets', { goal: 550000, days: 12 });
    document.getElementById('set-goal').value = s.goal;
    document.getElementById('set-days').value = s.days;

    refresh();
</script>
</body>
</html>
