<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>タク計 プレミアム</title>
    <link rel="apple-touch-icon" href="https://r.jina.ai/i/6f9064c5770146059d044f60f64c6328">
    
    <style>
        :root { --ios-blue: #007AFF; --ios-red: #ff3b30; --ios-orange: #ff9500; --bg: #f2f2f7; --card: #ffffff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-top: calc(env(safe-area-inset-top) + 10px); padding-bottom: 100px; color: #1c1c1e; -webkit-tap-highlight-color: transparent; }
        
        /* ターゲットヒーローエリア */
        .target-hero { background: linear-gradient(135deg, #007AFF, #5856D6); color: white; border-radius: 20px; padding: 25px 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,122,255,0.3); }
        .target-hero small { font-size: 0.9rem; opacity: 0.8; }
        .target-hero .val { font-size: 2.6rem; font-weight: 800; margin: 10px 0; letter-spacing: -1px; }
        
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { font-size: 1rem; color: #8e8e93; margin-top: 0; margin-bottom: 15px; }

        /* 日付操作ユニット */
        .date-unit { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .btn-step { background: #e5e5ea; border: none; border-radius: 12px; width: 50px; height: 50px; font-size: 1.2rem; font-weight: bold; }
        .date-input-wrap { flex: 1; position: relative; }
        input[type="date"] { width: 100%; border: 2px solid #e5e5ea; border-radius: 12px; height: 46px; text-align: center; font-size: 1.1rem; font-weight: 600; color: var(--ios-blue); -webkit-appearance: none; }

        /* メイン入力 */
        .input-main { text-align: center; margin-bottom: 10px; }
        .input-main label { font-size: 0.9rem; font-weight: bold; color: #666; display: block; margin-bottom: 5px; }
        .input-main input { width: 90%; border: none; border-bottom: 4px solid var(--ios-blue); font-size: 3rem; text-align: center; font-weight: 800; color: #1c1c1e; outline: none; padding: 10px 0; }
        .income-preview { color: var(--ios-red); font-weight: bold; font-size: 1.1rem; margin: 10px 0; height: 1.5rem; }

        .btn-add { width: 100%; background: var(--ios-blue); color: white; border: none; border-radius: 16px; padding: 20px; font-size: 1.4rem; font-weight: bold; box-shadow: 0 4px 12px rgba(0,122,255,0.3); }

        /* 履歴リスト */
        .hist-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 0.5px solid #c6c6c8; }
        .hist-item:last-child { border: none; }
        .hist-info { flex: 1; }
        .hist-info strong { font-size: 1.1rem; }
        .hist-info div { font-size: 0.8rem; color: #8e8e93; }
        .hist-actions { display: flex; gap: 15px; }
        .btn-icon { background: none; border: none; font-size: 1.3rem; padding: 5px; }

        /* 設定ページ */
        .row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 0.5px solid #c6c6c8; }
        .row input { width: 120px; text-align: right; border: none; font-size: 1.1rem; font-weight: 600; color: var(--ios-blue); outline: none; }

        /* ナビゲーション */
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border-top: 0.5px solid #c6c6c8; display: flex; padding-bottom: env(safe-area-inset-bottom); height: 80px; z-index: 1000; }
        nav button { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8e8e93; gap: 4px; }
        nav button.active { color: var(--ios-blue); }
        nav button span { font-size: 0.7rem; font-weight: 600; }
        nav button i { font-size: 1.5rem; }

        .tab-content { display: none; }
        .active-tab { display: block; }

        #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 25px; font-size: 0.9rem; z-index: 2000; visibility: hidden; opacity: 0; transition: 0.3s; }
        .show-toast { visibility: visible !important; opacity: 1 !important; }
    </style>
</head>
<body>

<div id="toast">保存完了！🚕</div>

<div id="page-input" class="tab-content active-tab">
    <div class="target-hero" id="hero-bg">
        <small id="hero-title">今日の残りノルマ (税抜)</small>
        <div class="val" id="disp-norm">0</div>
        <div id="disp-progress" style="font-size: 0.85rem; opacity: 0.9;">出勤進捗: -- / -- 日</div>
    </div>

    <div class="card">
        <div class="date-unit">
            <button class="btn-step" onclick="stepDate(-1)">◀</button>
            <div class="date-input-wrap">
                <input type="date" id="work-date" onchange="refresh()">
            </div>
            <button class="btn-step" onclick="stepDate(1)">▶</button>
        </div>

        <div class="input-main">
            <div style="background: #1c1c1e; color: white; padding: 8px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 15px;">
                今日の合計: <span id="disp-today-sum">0</span>円
            </div>
            <label>本日の税抜売上を追加</label>
            <input type="number" id="input-sales" pattern="\d*" placeholder="0" oninput="updatePreview()">
            <div class="income-preview" id="income-preview">手取り予測: 0円</div>
            <button class="btn-add" onclick="saveData()">売上を追加</button>
        </div>
    </div>
</div>

<div id="page-history" class="tab-content">
    <div class="card" style="background: #1c1c1e; color: white; text-align: center;">
        <h2 style="color: #8e8e93; margin-bottom: 5px;">今月の予想給与</h2>
        <div style="font-size: 2.2rem; font-weight: 800; color: var(--ios-orange);" id="hist-total-income">0円</div>
        <div style="font-size: 0.9rem; opacity: 0.8; margin-top: 5px;">売上合計: <span id="hist-total-sales">0</span>円</div>
    </div>
    <div class="card">
        <h2>📅 履歴一覧</h2>
        <div id="history-list"></div>
    </div>
</div>

<div id="page-settings" class="tab-content">
    <div class="card">
        <h2>⚙️ 目標設定</h2>
        <div class="row">
            <label>目標売上 (税抜)</label>
            <input type="number" id="set-goal" oninput="saveSettings()">
        </div>
        <div class="row">
            <label>月間出勤日数</label>
            <input type="number" id="set-days" oninput="saveSettings()">
        </div>
    </div>
    <div class="card" style="background: #e7f2ff;">
        <h2>📊 自動計算ステータス</h2>
        <div class="row"><span>今月の既出勤数</span><span id="stat-worked">0 日</span></div>
        <div class="row"><span>残り出勤数</span><span id="stat-remain">0 日</span></div>
        <div class="row" style="border:none; font-weight:bold;">
            <span>1日平均ノルマ</span><span id="stat-norm" style="color:var(--ios-blue);">0円</span>
        </div>
    </div>
</div>

<nav>
    <button onclick="showPage('input')" id="nav-input" class="active"><i>💰</i><span>入力</span></button>
    <button onclick="showPage('history')" id="nav-history"><i>📅</i><span>履歴</span></button>
    <button onclick="showPage('settings')" id="nav-settings"><i>⚙️</i><span>設定</span></button>
</nav>

<script>
    const DB = {
        save: (key, data) => localStorage.setItem(key, JSON.stringify(data)),
        load: (key, def) => JSON.parse(localStorage.getItem(key)) || def
    };

    // 西鉄タクシー歩合計算
    function calcIncome(netSales) {
        let rate = 0.55;
        if (netSales >= 550000) rate = 0.608;
        else if (netSales >= 470000) rate = 0.579;
        return Math.floor(netSales * rate);
    }

    function refresh() {
        const history = DB.load('taxi_hist_v9', []);
        const sets = DB.load('taxi_sets_v9', { goal: 550000, days: 12 });
        const selectedDate = document.getElementById('work-date').value;
        const currentMonth = selectedDate.substring(0, 7);

        // 月間データ抽出
        const monthly = history.filter(h => h.date.startsWith(currentMonth));
        const totalSales = monthly.reduce((sum, h) => sum + h.sales, 0);
        const workedDates = [...new Set(monthly.map(h => h.date))];
        const workedCount = workedDates.length;

        // 残り日数の判定
        const hasWorkToday = history.some(h => h.date === selectedDate);
        const remainDays = Math.max(1, sets.days - (hasWorkToday ? workedCount - 1 : workedCount));

        // ノルマ計算
        const salesExcludeToday = monthly.filter(h => h.date !== selectedDate).reduce((sum, h) => sum + h.sales, 0);
        const need = Math.max(0, sets.goal - salesExcludeToday);
        const dailyNorm = Math.ceil(need / remainDays);
        
        const todaySum = monthly.filter(h => h.date === selectedDate).reduce((sum, h) => sum + h.sales, 0);
        const todayLeft = dailyNorm - todaySum;

        // UI反映：入力画面
        const normDisp = document.getElementById('disp-norm');
        const heroBg = document.getElementById('hero-bg');
        if (todayLeft <= 0) {
            normDisp.innerText = "目標達成！";
            heroBg.style.background = "linear-gradient(135deg, #28a745, #1e7e34)";
        } else {
            normDisp.innerText = todayLeft.toLocaleString() + "円";
            heroBg.style.background = "linear-gradient(135deg, #007AFF, #5856D6)";
        }
        document.getElementById('disp-progress').innerText = `今月の出勤: ${workedCount} / ${sets.days} 日`;
        document.getElementById('disp-today-sum').innerText = todaySum.toLocaleString();

        // UI反映：履歴画面
        document.getElementById('hist-total-sales').innerText = totalSales.toLocaleString() + "円";
        document.getElementById('hist-total-income').innerText = calcIncome(totalSales).toLocaleString() + "円";
        
        const listHtml = monthly.sort((a,b) => b.id - a.id).map(h => `
            <div class="hist-item">
                <div class="hist-info">
                    <strong>${h.date.split('-')[2]}日</strong>
                    <div>税抜売上: ${Math.floor(h.sales).toLocaleString()}円</div>
                </div>
                <div class="hist-actions">
                    <button class="btn-icon" onclick="editData(${h.id})">✏️</button>
                    <button class="btn-icon" onclick="deleteData(${h.id})">🗑️</button>
                </div>
            </div>
        `).join('');
        document.getElementById('history-list').innerHTML = listHtml || '<div style="text-align:center;padding:20px;color:#999;">履歴なし</div>';

        // UI反映：設定画面
        document.getElementById('stat-worked').innerText = workedCount + " 日";
        document.getElementById('stat-remain').innerText = remainDays + " 日";
        document.getElementById('stat-norm').innerText = dailyNorm.toLocaleString() + "円";
        
        updatePreview();
    }

    function stepDate(n) {
        const d = new Date(document.getElementById('work-date').value);
        d.setDate(d.getDate() + n);
        document.getElementById('work-date').valueAsDate = d;
        refresh();
    }

    function updatePreview() {
        const val = parseFloat(document.getElementById('input-sales').value) || 0;
        const history = DB.load('taxi_hist_v9', []);
        const month = document.getElementById('work-date').value.substring(0, 7);
        const currentTotal = history.filter(h => h.date.startsWith(month)).reduce((sum, h) => sum + h.sales, 0);
        document.getElementById('income-preview').innerText = `手取り予測: ${calcIncome(currentTotal + val).toLocaleString()}円`;
    }

    function saveData() {
        const date = document.getElementById('work-date').value;
        const sales = parseFloat(document.getElementById('input-sales').value);
        if (!sales) return;

        const history = DB.load('taxi_hist_v9', []);
        history.push({ id: Date.now(), date, sales });
        DB.save('taxi_hist_v9', history);

        document.getElementById('input-sales').value = '';
        showToast("保存完了！🚕");
        refresh();
    }

    function deleteData(id) {
        if (!confirm('本当にこの履歴を削除する？')) return;
        let history = DB.load('taxi_hist_v9', []);
        history = history.filter(h => h.id !== id);
        DB.save('taxi_hist_v9', history);
        refresh();
    }

    function editData(id) {
        let history = DB.load('taxi_hist_v9', []);
        const item = history.find(h => h.id === id);
        const newVal = prompt(`${item.date} の売上を修正（税抜）`, Math.floor(item.sales));
        if (newVal !== null) {
            item.sales = parseFloat(newVal) || 0;
            DB.save('taxi_hist_v9', history);
            refresh();
        }
    }

    function saveSettings() {
        const data = {
            goal: parseFloat(document.getElementById('set-goal').value) || 550000,
            days: parseFloat(document.getElementById('set-days').value) || 12
        };
        DB.save('taxi_sets_v9', data);
        refresh();
    }

    function showPage(p) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + p).classList.add('active-tab');
        document.getElementById('nav-' + p).classList.add('active');
        refresh();
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show-toast');
        setTimeout(() => t.classList.remove('show-toast'), 2000);
    }

    // 初期起動
    const today = new Date();
    document.getElementById('work-date').valueAsDate = today;
    const s = DB.load('taxi_sets_v9', { goal: 550000, days: 12 });
    document.getElementById('set-goal').value = s.goal;
    document.getElementById('set-days').value = s.days;
    refresh();
</script>
</body>
</html>
