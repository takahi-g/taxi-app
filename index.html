<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="タク計">
    <title>タク計</title>
    <style>
        :root { --ios-blue: #007AFF; --ios-red: #ff3b30; --ios-green: #34c759; --bg: #f2f2f7; --card: #ffffff; --dark-card: #333333; --pencil-bg: #eef6ff; --trash-bg: #fff1f0; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-top: calc(env(safe-area-inset-top) + 10px); padding-bottom: 100px; color: #1c1c1e; }
        .target-hero { background: linear-gradient(135deg, #5e5ce6, #af52de); color: white; border-radius: 20px; padding: 25px 20px; text-align: center; margin-bottom: 20px; transition: transform 0.2s; }
        .target-hero .val { font-size: 2.8rem; font-weight: 800; margin: 10px 0; font-variant-numeric: tabular-nums; }
        .black-card { background: var(--dark-card); color: white; border-radius: 20px; padding: 20px; text-align: left; margin-bottom: 20px; }
        .badge { background: var(--ios-green); color: white; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .total-val { font-size: 2.4rem; font-weight: 800; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { font-size: 1rem; color: var(--ios-blue); margin: 0 0 15px 0; }
        
        /* カレンダーのスタイル */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-label { font-size: 0.7rem; color: #8e8e93; font-weight: bold; padding-bottom: 5px; }
        .cal-cell { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; position: relative; border-radius: 10px; }
        .has-data::after { content: ''; width: 6px; height: 6px; background: var(--ios-blue); border-radius: 50%; position: absolute; bottom: 4px; }
        .is-today { background: #e5e5ea; }

        .hist-table { width: 100%; border-collapse: collapse; }
        .hist-table td { padding: 15px 0; border-bottom: 1px solid #f2f2f7; }
        .hist-btns { display: flex; gap: 10px; justify-content: flex-end; }
        .btn-pencil, .btn-trash { width: 44px; height: 44px; border-radius: 12px; border: none; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .btn-pencil { background: var(--pencil-bg); } .btn-trash { background: var(--trash-bg); }

        nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-top: 0.5px solid #c6c6c8; display: flex; padding-bottom: env(safe-area-inset-bottom); height: 80px; box-sizing: border-box; z-index: 100; }
        nav button { flex: 1; border: none; background: none; color: #8e8e93; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        nav button.active { color: var(--ios-blue); }
        .tab-content { display: none; } .active-tab { display: block; }
        input[type="date"] { border: 1px solid #ddd; border-radius: 12px; padding: 12px; font-size: 1rem; color: var(--ios-blue); font-weight: bold; width: 100%; box-sizing: border-box; -webkit-appearance: none; background: #efeff4; }
        @keyframes count-up { from { transform: translateY(5px); opacity: 0.7; } to { transform: translateY(0); opacity: 1; } }
        .anim-pop { animation: count-up 0.3s ease-out; }
    </style>
</head>
<body>

<div id="page-input" class="tab-content active-tab">
    <div class="target-hero" id="hero-box">
        <div style="font-size: 0.9rem; opacity: 0.8;">今日の残りノルマ (税抜)</div>
        <div class="val"><span id="disp-norm">0</span> 円</div>
        <div id="disp-progress" style="font-size: 0.8rem; opacity: 0.8;">---</div>
    </div>
    <div class="card">
        <input type="date" id="work-date" onchange="refresh()" style="margin-bottom:20px;">
        <div style="text-align: center;">
            <div style="background: #1c1c1e; color: white; padding: 12px 10px; border-radius: 16px; display: inline-block; margin-bottom: 25px; min-width: 95%; box-sizing: border-box;">
                <div id="disp-today-sum"></div>
            </div>
            <div style="text-align: left; margin-left: 5%; margin-bottom: 8px;">
                <label style="font-size: 0.9rem; font-weight: bold; color: #8e8e93;">売上入力 (税込)</label>
            </div>
            <div style="position: relative; width: 90%; margin: 0 auto;">
                <span style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 2rem; font-weight: 800; color: var(--ios-blue);">¥</span>
                <input type="number" id="input-gross" pattern="\d*" placeholder="0" style="width: 100%; border: 2px solid #e5e5ea; border-radius: 16px; padding: 15px 15px 15px 50px; font-size: 2.8rem; text-align: right; font-weight: 800; outline: none; background: #f9f9fb; box-sizing: border-box; color: #1c1c1e;">
            </div>
            <button onclick="saveData()" style="width:100%; background:var(--ios-blue); color:white; border:none; border-radius:16px; padding:20px; font-size:1.4rem; font-weight:bold; margin-top:30px; box-shadow: 0 4px 12px rgba(0,122,255,0.3);">売上を追加</button>
        </div>
    </div>
</div>

<div id="page-history" class="tab-content">
    <div style="display:flex; gap:10px; margin-bottom:15px;">
        <select id="hist-year" onchange="refresh()" style="flex:1; padding:12px; border-radius:12px; border:none; font-weight:bold; background:white;"></select>
        <select id="hist-month" onchange="refresh()" style="flex:1; padding:12px; border-radius:12px; border:none; font-weight:bold; background:white;"></select>
    </div>
    <div class="card" style="padding: 15px;">
        <div class="cal-grid" id="cal-container"></div>
    </div>
    <div class="black-card">
        <div id="hist-label" style="font-size: 0.9rem; opacity: 0.7; margin-bottom: 5px;">集計</div>
        <div class="badge" id="hist-rate">暫定歩合: --%</div>
        <div class="total-val" id="hist-total-income">0円</div>
        <div style="font-size:0.9rem; opacity:0.7; margin-top:5px;">期間総売上: <span id="hist-total-sales">0</span>円</div>
    </div>
    <div class="card">
        <h2 style="color:#1c1c1e">履歴リスト</h2>
        <table class="hist-table"><tbody id="history-list"></tbody></table>
    </div>
</div>

<div id="page-settings" class="tab-content">
    <div class="card">
        <h2>⚙️ 設定</h2>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0; border-bottom:1px solid #f2f2f7;">
            <span>目標売上 (税抜)</span>
            <input type="number" id="set-goal" oninput="saveSettings()" style="width:120px; text-align:right; border:none; font-size:1.1rem; font-weight:bold; color:var(--ios-blue);">
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px 0;">
            <span>全出勤日数</span>
            <input type="number" id="set-days" oninput="saveSettings()" style="width:120px; text-align:right; border:none; font-size:1.1rem; font-weight:bold; color:var(--ios-blue);">
        </div>
    </div>
</div>

<nav>
    <button onclick="showPage('input')" id="nav-input" class="active"><span>💰 入力</span></button>
    <button onclick="showPage('history')" id="nav-history"><span>📅 履歴</span></button>
    <button onclick="showPage('settings')" id="nav-settings"><span>⚙️ 設定</span></button>
</nav>

<script>
    const DB = { save: (k, d) => localStorage.setItem(k, JSON.stringify(d)), load: (k, def) => JSON.parse(localStorage.getItem(k)) || def };
    let currentNorm = 0;
    
    function getRate(net) { 
        if (net >= 550000) return 60.8;
        if (net >= 470000) return 57.9;
        return 55.0;
    }

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const val = Math.floor(progress * (end - start) + start);
            obj.innerHTML = val.toLocaleString();
            if (progress < 1) window.requestAnimationFrame(step);
        };
        window.requestAnimationFrame(step);
    }

    function renderCalendar(year, month, history) {
        const container = document.getElementById('cal-container');
        container.innerHTML = '';
        const days = ['日','月','火','水','木','金','土'];
        days.forEach(d => container.innerHTML += `<div class="cal-day-label">${d}</div>`);
        
        const firstDay = new Date(year, month - 1, 1).getDay();
        const lastDate = new Date(year, month, 0).getDate();
        const todayStr = new Date().toISOString().split('T')[0];

        for (let i = 0; i < firstDay; i++) container.innerHTML += '<div></div>';
        for (let d = 1; d <= lastDate; d++) {
            const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasData = history.some(h => h.date === dateStr);
            const isToday = dateStr === todayStr ? 'is-today' : '';
            container.innerHTML += `<div class="cal-cell ${hasData ? 'has-data' : ''} ${isToday}">${d}</div>`;
        }
    }

    function refresh(isSave = false) {
        const history = DB.load('taxi_v11_hist', []);
        const sets = DB.load('taxi_v11_sets', { goal: 550000, days: 12 });
        const selectedDate = document.getElementById('work-date').value;
        const curMonth = selectedDate.substring(0, 7);
        const monthlyData = history.filter(h => h.date.startsWith(curMonth));
        const workedDates = [...new Set(monthlyData.map(h => h.date))];
        const workedCount = workedDates.length;

        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];
        const isTodayEntered = workedDates.includes(todayStr);
        let remainDaysForNorm = Math.max(1, sets.days - (isTodayEntered && now.getHours() < 7 ? workedCount - 1 : workedCount));

        const salesBeforeToday = monthlyData.filter(h => h.date !== todayStr).reduce((sum, h) => sum + h.net, 0);
        const dailyBaseNorm = Math.ceil(Math.max(0, sets.goal - salesBeforeToday) / (remainDaysForNorm || 1));
        const todayRecords = monthlyData.filter(h => h.date === selectedDate);
        const todayGrossSum = todayRecords.reduce((sum, h) => sum + h.gross, 0);
        const todayNetSum = todayRecords.reduce((sum, h) => sum + h.net, 0);
        const finalTodayNorm = Math.max(0, dailyBaseNorm - todayNetSum);

        const normDisplay = document.getElementById('disp-norm');
        if (isSave) {
            animateValue(normDisplay, currentNorm, finalTodayNorm, 500);
            const hero = document.getElementById('hero-box');
            hero.classList.remove('anim-pop'); void hero.offsetWidth; hero.classList.add('anim-pop');
        } else {
            normDisplay.innerText = Math.floor(finalTodayNorm).toLocaleString();
        }
        currentNorm = finalTodayNorm;
        document.getElementById('disp-progress').innerText = `今月: ${workedCount} / ${sets.days} 回出勤`;
        document.getElementById('disp-today-sum').innerHTML = 
            `<div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <span style="font-size: 0.75rem; color: #aaa;">今日の合計(税抜)</span>
                <span style="color: #FFD700; font-size: 1.5rem; font-weight: 900; flex-grow: 1; text-align: center;">${Math.floor(todayNetSum).toLocaleString()}<small style="font-size:0.8rem;">円</small></span>
                <span style="font-size: 0.75rem; color: #8e8e93;">(税込${Math.floor(todayGrossSum).toLocaleString()}円)</span>
             </div>`;

        const fYear = parseInt(document.getElementById('hist-year').value);
        const fMonth = parseInt(document.getElementById('hist-month').value);
        renderCalendar(fYear, fMonth, history);

        const fHist = history.filter(h => h.date.startsWith(`${fYear}-${String(fMonth).padStart(2,'0')}`));
        const fTotalNet = fHist.reduce((sum, h) => sum + h.net, 0);
        const fRate = getRate(fTotalNet);
        document.getElementById('hist-label').innerText = `${fYear}年${fMonth}月の合計`;
        document.getElementById('hist-rate').innerText = `暫定歩合: ${fRate}%`;
        document.getElementById('hist-total-income').innerText = Math.floor(fTotalNet * (fRate/100)).toLocaleString() + "円";
        document.getElementById('hist-total-sales').innerText = Math.floor(fTotalNet).toLocaleString();

        document.getElementById('history-list').innerHTML = fHist.sort((a,b) => b.id - a.id).map(h => `
            <tr>
                <td style="font-weight:bold;">${h.date.substring(5).replace('-','/')}</td>
                <td style="font-weight:800;font-size:1.1rem;text-align:center;">${Math.floor(h.net).toLocaleString()}</td>
                <td class="hist-btns">
                    <button class="btn-pencil" onclick="editData(${h.id})">✏️</button>
                    <button class="btn-trash" onclick="deleteData(${h.id})">🗑️</button>
                </td>
            </tr>
        `).join('') || '<tr><td colspan="3" style="text-align:center;padding:20px;">なし</td></tr>';
    }

    function saveData() {
        const date = document.getElementById('work-date').value;
        const gross = parseFloat(document.getElementById('input-gross').value);
        if (!gross) return;
        const h = DB.load('taxi_v11_hist', []);
        h.push({ id: Date.now(), date, gross, net: Math.floor(gross/1.1) });
        DB.save('taxi_v11_hist', h);
        document.getElementById('input-gross').value = '';
        refresh(true);
    }
    function deleteData(id) { if(confirm('消去しますか？')) { const h = DB.load('taxi_v11_hist', []); DB.save('taxi_v11_hist', h.filter(x => x.id !== id)); refresh(); } }
    function editData(id) { const h = DB.load('taxi_v11_hist', []); const i = h.find(x => x.id === id); const n = prompt('税込修正', i.gross); if(n) { i.gross = parseFloat(n); i.net = Math.floor(i.gross/1.1); DB.save('taxi_v11_hist', h); refresh(); } }
    function saveSettings() { DB.save('taxi_v11_sets', { goal: parseFloat(document.getElementById('set-goal').value)||550000, days: parseFloat(document.getElementById('set-days').value)||12 }); refresh(); }
    function showPage(p) { document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab')); document.querySelectorAll('nav button').forEach(el => el.classList.remove('active')); document.getElementById('page-' + p).classList.add('active-tab'); document.getElementById('nav-' + p).classList.add('active'); window.scrollTo(0,0); refresh(); }

    document.getElementById('work-date').valueAsDate = new Date();
    const yr = document.getElementById('hist-year'); const mt = document.getElementById('hist-month');
    for(let y=2026; y>=2024; y--) { let o = document.createElement('option'); o.value=y; o.text=y+'年'; yr.add(o); }
    for(let m=1; m<=12; m++) { let o = document.createElement('option'); o.value=m; o.text=m+'月'; if(m === new Date().getMonth()+1) o.selected = true; mt.add(o); }
    const s = DB.load('taxi_v11_sets', { goal: 550000, days: 12 });
    document.getElementById('set-goal').value = s.goal; document.getElementById('set-days').value = s.days;
    refresh();
</script>
</body>
</html>
