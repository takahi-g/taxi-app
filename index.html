<script>
    /* ====== 設定 ====== */
    const STORAGE = {
        HIST: 'taxi_v11_hist',
        SETS: 'taxi_v11_sets'
    };

    const DB = {
        save: (k, d) => localStorage.setItem(k, JSON.stringify(d)),
        load: (k, def) => JSON.parse(localStorage.getItem(k)) || def
    };
    
    // 西鉄タクシー歩合率（税抜売上 net 基準）
    function getRate(net) { 
        if (net >= 550000) return 60.8; 
        if (net >= 470000) return 57.9; 
        if (net >= 420000) return 55.0;
        return 50.0;
    }

    function getCurrentMonth() {
        const d = document.getElementById('work-date').value;
        return d ? d.substring(0, 7) : null;
    }

    function refresh() {
        const history = DB.load(STORAGE.HIST, []);
        const sets = DB.load(STORAGE.SETS, { goal: 550000, days: 12 });
        const curMonth = getCurrentMonth();

        /* ====== ステータス計算 ====== */
        const monthlyData = curMonth
            ? history.filter(h => h.date && h.date.startsWith(curMonth))
            : [];

        const workedCount = [...new Set(monthlyData.map(h => h.date))].length;
        const totalNet = monthlyData.reduce((sum, h) => sum + h.net, 0);

        document.getElementById('stat-worked').innerText = workedCount + " 日";
        const remain = Math.max(0, sets.days - workedCount);
        document.getElementById('stat-remain').innerText = remain + " 日";
        const norm = remain > 0
            ? Math.ceil(Math.max(0, sets.goal - totalNet) / remain)
            : 0;
        document.getElementById('stat-daily-norm').innerText = norm.toLocaleString() + "円";

        /* ====== 履歴・集計 ====== */
        const fYear = document.getElementById('hist-year').value;
        const fMonth = document.getElementById('hist-month').value;
        const fHist = history.filter(h => h.date && h.date.startsWith(`${fYear}-${fMonth}`));
        const fTotalNet = fHist.reduce((sum, h) => sum + h.net, 0);
        const fRate = getRate(fTotalNet);

        document.getElementById('hist-label').innerText = `${fYear}年${fMonth}月の合計`;
        document.getElementById('hist-rate').innerText = `暫定歩合: ${fRate}%`;
        document.getElementById('hist-total-income').innerText =
            Math.floor(fTotalNet * (fRate / 100)).toLocaleString() + "円";
        document.getElementById('hist-total-sales').innerText =
            Math.floor(fTotalNet).toLocaleString();

        document.getElementById('history-list').innerHTML =
            fHist.sort((a, b) => b.id - a.id).map(h => `
                <tr>
                    <td style="font-weight:bold;">${h.date.substring(5).replace('-', '/')}</td>
                    <td style="font-weight:800; font-size:1.1rem;">${Math.floor(h.net).toLocaleString()}</td>
                    <td class="hist-btns">
                        <button class="btn-icon btn-pencil" onclick="editData(${h.id})">✏️</button>
                        <button class="btn-icon btn-trash" onclick="deleteData(${h.id})">🗑️</button>
                    </td>
                </tr>
            `).join('') ||
            '<tr><td colspan="3" style="text-align:center; padding:20px;">なし</td></tr>';
    }

    function updatePreview() {
        const gross = parseFloat(document.getElementById('input-gross').value) || 0;
        const curMonth = getCurrentMonth();
        if (!curMonth) {
            document.getElementById('preview-area').innerText = '日付を選択してください';
            return;
        }

        const net = Math.floor(gross / 1.1);
        const history = DB.load(STORAGE.HIST, []);
        const total = history
            .filter(h => h.date && h.date.startsWith(curMonth))
            .reduce((sum, h) => sum + h.net, 0);

        const combined = total + net;
        const rate = getRate(combined);

        document.getElementById('preview-area').innerText =
            `今月見込み手取り: ${Math.floor(combined * (rate / 100)).toLocaleString()}円`;
    }

    function saveData() {
        const date = document.getElementById('work-date').value;
        const gross = parseFloat(document.getElementById('input-gross').value);

        if (!date) {
            alert('日付を選択してください');
            return;
        }
        if (!gross) return;

        const h = DB.load(STORAGE.HIST, []);
        h.push({
            id: Date.now(),
            date,
            gross,
            net: Math.floor(gross / 1.1)
        });

        DB.save(STORAGE.HIST, h);
        document.getElementById('input-gross').value = '';
        refresh();
    }

    function deleteData(id) {
        if (!confirm('消去しますか？')) return;
        const h = DB.load(STORAGE.HIST, []);
        DB.save(STORAGE.HIST, h.filter(x => x.id !== id));
        refresh();
    }

    function editData(id) {
        const h = DB.load(STORAGE.HIST, []);
        const i = h.find(x => x.id === id);
        const n = prompt('税込修正', i.gross);
        if (!n) return;
        i.gross = parseFloat(n);
        i.net = Math.floor(i.gross / 1.1);
        DB.save(STORAGE.HIST, h);
        refresh();
    }

    function saveSettings() {
        DB.save(STORAGE.SETS, {
            goal: parseFloat(document.getElementById('set-goal').value) || 550000,
            days: parseFloat(document.getElementById('set-days').value) || 12
        });
        refresh();
    }

    function showPage(p) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById('page-' + p).classList.add('active-tab');
        document.getElementById('nav-' + p).classList.add('active');
        refresh();
    }

    /* ====== 初期化 ====== */
    document.getElementById('work-date').valueAsDate = new Date();

    const yr = document.getElementById('hist-year');
    const mt = document.getElementById('hist-month');
    const now = new Date();

    for (let y = 2026; y >= 2024; y--) {
        let o = document.createElement('option');
        o.value = y;
        o.text = y + '年';
        yr.add(o);
    }
    for (let m = 1; m <= 12; m++) {
        let o = document.createElement('option');
        o.value = String(m).padStart(2, '0');
        o.text = m + '月';
        if (m === now.getMonth() + 1) o.selected = true;
        mt.add(o);
    }

    const s = DB.load(STORAGE.SETS, { goal: 550000, days: 12 });
    document.getElementById('set-goal').value = s.goal;
    document.getElementById('set-days').value = s.days;

    refresh();
</script>
